<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="340" viewBox="0 0 1040 340" role="img" aria-labelledby="title desc">
  <title id="title">任务协作流程 / Task collaboration flow</title>
  <desc id="desc">Codex delegates a text task, follows progress and clarification on the same task, then retrieves the Dot's result.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0L8 4.5L0 9" fill="none" stroke="#9cd5d4" stroke-width="1.7"/></marker>
  </defs>
  <rect width="1040" height="340" rx="18" fill="#1b2d38"/>
  <g font-family="Segoe UI,Arial,sans-serif">
    <text x="36" y="43" fill="#f6f3e9" font-size="21" font-weight="600">一项任务，同一任务 ID / One task, one task ID</text>
    <text x="36" y="68" fill="#b4c5cd" font-size="14">文本任务从委派到结果读回持续关联 / Follow the text task from delegation to retrieved result</text>
    <rect x="36" y="106" width="248" height="112" rx="13" fill="#243d49" stroke="#4b6571"/>
    <text x="58" y="146" fill="#f6f3e9" font-size="22" font-weight="600">委派 / Delegate</text>
    <text x="58" y="176" fill="#b4c5cd" font-size="15">Codex 提交目标与文本资料</text>
    <text x="58" y="198" fill="#b4c5cd" font-size="14">Submit a goal and text material</text>
    <rect x="396" y="106" width="248" height="112" rx="13" fill="#f6f3e9"/>
    <text x="418" y="146" fill="#1b2d38" font-size="22" font-weight="600">跟进 / Follow up</text>
    <text x="418" y="176" fill="#49616b" font-size="15">进度 · 澄清</text>
    <text x="418" y="198" fill="#49616b" font-size="14">Progress · Clarification</text>
    <rect x="756" y="106" width="248" height="112" rx="13" fill="#243d49" stroke="#4b6571"/>
    <text x="778" y="146" fill="#f6f3e9" font-size="22" font-weight="600">取回 / Retrieve</text>
    <text x="778" y="176" fill="#b4c5cd" font-size="15">读取 Dot 返回的结果</text>
    <text x="778" y="198" fill="#b4c5cd" font-size="14">Read the result from your Dot</text>
    <path d="M294 160H382" fill="none" stroke="#9cd5d4" stroke-width="2.2" marker-end="url(#arrow)"/>
    <path d="M654 160H742" fill="none" stroke="#9cd5d4" stroke-width="2.2" marker-end="url(#arrow)"/>
    <text x="404" y="258" fill="#e6c783" font-size="12">Dot 提问 · Codex 回答 / Dot asks · Codex answers</text>
    <text x="36" y="322" fill="#9cd5d4" font-size="13" font-weight="600">任务 ID 贯穿后续查询 / The same task ID links follow-up queries</text>
  </g>
</svg>
