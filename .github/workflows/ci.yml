name: Windows validation
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
          cache: npm
      - name: Private runtime and dependencies
        shell: pwsh
        run: |
          ./scripts/bootstrap.ps1
          ./scripts/dev.ps1 install
      - name: Prepare required Codex CLI maintenance coverage
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $codexDir = Join-Path $env:RUNNER_TEMP ('codex-dots-ci-codex-' + [Guid]::NewGuid().ToString('N'))
          npm.cmd install --prefix $codexDir --cache (Join-Path $codexDir 'npm-cache') --ignore-scripts --no-save --package-lock=false --no-audit --no-fund --registry=https://registry.npmjs.org '@openai/codex-win32-x64@npm:@openai/codex@0.162.0-alpha.2-win32-x64'
          if ($LASTEXITCODE -ne 0) { throw 'Required official Codex CLI installation failed.' }
          $codexExe = Join-Path $codexDir 'node_modules\@openai\codex-win32-x64\vendor\x86_64-pc-windows-msvc\bin\codex.exe'
          if (-not (Test-Path -LiteralPath $codexExe -PathType Leaf)) { throw 'Required Windows x64 Codex executable is missing.' }
          $version = & $codexExe --version
          if ($LASTEXITCODE -ne 0 -or $version -ne 'codex-cli 0.162.0-alpha.2') { throw 'Required Codex CLI version mismatch.' }
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "CODEX_DOTS_TEST_CODEX=$codexExe" -Encoding utf8
          Add-Content -LiteralPath $env:GITHUB_ENV -Value 'CODEX_DOTS_REQUIRE_CODEX_TESTS=1' -Encoding utf8
      - name: Public source checks
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          ./.runtime/node-v24.21.0-win-x64/node.exe scripts/check-release.mjs --history
          if ($LASTEXITCODE -ne 0) { throw 'Public source and history checks failed.' }
          ./.runtime/node-v24.21.0-win-x64/node.exe --test test/release-check.test.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Release gate regression tests failed.' }
          ./test/release-archive.test.ps1
      - name: Build and test
        shell: pwsh
        run: |
          ./scripts/dev.ps1 build
          ./scripts/test-ci.ps1
      - name: Prepare Go for the patched Tunnel
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.0'
          cache: false
      - name: Build patched Tunnel and package Windows artifact
        shell: pwsh
        run: |
          ./third-party/tunnel-client/build.ps1 -GoCompiler (Get-Command go).Source
          ./scripts/package.ps1 -IncludeTunnel -SkipTests
      - name: Validate tray transport and refresh lifecycle
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $tray = @(Get-ChildItem artifacts/private/packages -Filter CodexDotsBridge.Tray.exe -Recurse)
          if ($tray.Count -ne 1) { throw 'Expected one packaged tray executable.' }
          ./test/tray-http.test.ps1 -TrayExecutable $tray[0].FullName
          ./test/tray-refresh.test.ps1 -TrayExecutable $tray[0].FullName
      - name: Build and validate single-file Setup
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $tools = Join-Path $env:RUNNER_TEMP 'dots-inno-7.1.0'
          New-Item -ItemType Directory -Path $tools | Out-Null
          $download = Join-Path $tools 'innosetup-7.1.0-x64.exe'
          Invoke-WebRequest 'https://github.com/jrsoftware/issrc/releases/download/is-7_1_0/innosetup-7.1.0-x64.exe' -OutFile $download
          if ((Get-FileHash -LiteralPath $download).Hash.ToLowerInvariant() -ne '0362a383ed217d4c4239b5933866dd96d3eb2102737da92f80f6057a4b40df2f') { throw 'Compiler download digest mismatch.' }
          $signature = Get-AuthenticodeSignature -FilePath $download
          if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notlike '*Pyrsys B.V.*') { throw 'Compiler download signature invalid.' }
          $compilerRoot = Join-Path $tools 'compiler'
          $process = Start-Process -FilePath $download -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/NOICONS','/CURRENTUSER',('/DIR="'+$compilerRoot+'"')) -WindowStyle Hidden -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw 'Compiler installation failed.' }
          $payload = @(Get-ChildItem artifacts/private/packages -Directory)
          if ($payload.Count -ne 1) { throw 'Expected one checked payload.' }
          ./scripts/build-setup.ps1 -Compiler (Join-Path $compilerRoot 'ISCC.exe') -PackageRoot $payload[0].FullName -OutputDirectory artifacts/private/setup
          $testAppId = 'CodexDotsBridgeSetup.Test.' + [Guid]::NewGuid().ToString()
          ./scripts/test-ci.ps1 -SetupExecutable artifacts/private/setup/Setup.exe -InstallerAppId $testAppId -TestDirectory (Join-Path $env:RUNNER_TEMP 'dots-install-acceptance')
          $acceptance = @(Get-ChildItem (Join-Path $env:RUNNER_TEMP 'dots-install-acceptance') -Filter acceptance-result.json -Recurse)
          if ($acceptance.Count -ne 1) { throw 'Expected one completed installer acceptance receipt.' }
          Copy-Item -LiteralPath $acceptance[0].FullName -Destination artifacts/private/setup/acceptance-result.json
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64-candidate
          path: |
            artifacts/private/packages/*.zip
            artifacts/private/packages/*.sha256
            artifacts/private/setup/Setup.exe
            artifacts/private/setup/Setup.exe.sha256
            artifacts/private/setup/setup-build.json
            artifacts/private/setup/acceptance-result.json
          retention-days: 14
